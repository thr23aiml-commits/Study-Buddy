<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Summarizer</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        :root {
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --secondary: #10B981;
            --secondary-hover: #059669;
            --bg-dark: #111827;
            --bg-card: #1F2937;
            --text-light: #F9FAFB;
            --text-gray: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        h1 {
            color: var(--text-light);
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.8s ease forwards;
        }

        .card:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
        }

        .card h2 {
            color: var(--text-light);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 svg {
            width: 24px;
            height: 24px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 15px;
            resize: vertical;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        button svg {
            width: 20px;
            height: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section h3 {
            color: var(--text-light);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .result-content {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-light);
        }

        .error-message {
            color: #EF4444;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: var(--text-gray);
            opacity: 0.7;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        .container::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0.1;
            z-index: -1;
        }

        .container::after {
            content: '';
            position: fixed;
            bottom: -200px;
            left: -200px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            opacity: 0.1;
            z-index: -1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .back-button {
            position: absolute;
            left: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(-3px);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="back-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </a>
            <h1>Notes Summarizer</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                Input Text
            </h2>
            <textarea id="inputText" placeholder="Paste your notes here..."></textarea>
            <button id="summarizeBtn" onclick="summarizeText()">
                <span class="spinner" style="display: none;"></span>
                Summarize
            </button>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <div class="card result-card" id="resultCard">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Summary
            </h2>
            <div class="result-section">
                <h3>Generated Summary</h3>
                <div class="result-content" id="summaryResult"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Notes Summarizer</p>
    </footer>

    <script>
        async function summarizeText() {
            const inputText = document.getElementById('inputText').value.trim();
            const summarizeBtn = document.getElementById('summarizeBtn');
            const spinner = summarizeBtn.querySelector('.spinner');
            const errorMessage = document.getElementById('errorMessage');
            const resultCard = document.getElementById('resultCard');
            const summaryResult = document.getElementById('summaryResult');

            if (!inputText) {
                errorMessage.textContent = 'Please enter some text to summarize.';
                errorMessage.style.display = 'block';
                return;
            }

            // Show loading state
            summarizeBtn.disabled = true;
            spinner.style.display = 'inline-block';
            errorMessage.style.display = 'none';
            resultCard.style.display = 'none';

            try {
                const response = await fetch('/summarize-paragraph/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content,
                    },
                    body: JSON.stringify({
                        paragraph: inputText
                    })
                });

                if (!response.ok) {
                    // Show the server's friendly message (rate limit, bad input, AI error).
                    let message = 'An error occurred while generating the summary. Please try again.';
                    try {
                        const err = await response.json();
                        if (err.error) message = err.error;
                    } catch (e) { /* body was not JSON; keep the default message */ }
                    const serverError = new Error(message);
                    serverError.userFacing = true;
                    throw serverError;
                }

                const data = await response.json();
                summaryResult.textContent = data.summary;
                resultCard.style.display = 'block';
            } catch (error) {
                errorMessage.textContent = error.userFacing ? error.message : 'An error occurred while generating the summary. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                summarizeBtn.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
